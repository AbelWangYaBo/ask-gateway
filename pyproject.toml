[project]
name = "ask-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abel", email = "1417611676@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "deepseek-harness-sdk==0.2.1rc2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "sse-starlette>=3.7.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ask-gateway = "ask_gateway:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
# 显式钉住规则集：E(pycodestyle) + F(pyflakes) + I(import 排序)
# 不依赖 ruff 版本默认，避免小版本升级变成无评审的规则扩面
select = ["E", "F", "I"]
ignore = ["E501"]
